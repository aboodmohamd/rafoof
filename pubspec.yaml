name: rafoof
description: "Rafoof, a Flutter store app built on the DummyJSON API."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  flutter_screenutil: ^5.9.3
  dio: ^5.11.1
  get_it: ^9.3.0
  sqflite: ^2.4.4+1
  flutter_secure_storage: ^11.2.0
  flutter_dotenv: ^6.0.1
  pretty_dio_logger: ^1.4.0
  path: ^1.9.1
  cached_network_image: ^4.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env.dev
    - assets/img/
